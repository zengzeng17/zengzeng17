    const escapeHtml = value => value.replace(/[&<>"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
    const slugify = (text, index) => `section-${index}-${text.replace(/[\s\p{P}]+/gu, '-').replace(/^-|-$/g, '').toLowerCase()}`;
    const inline = source => {
      const tokens = [];
      let text = source.replace(/`([^`]+)`/g, (_, value) => { tokens.push(`<code>${escapeHtml(value)}</code>`); return `@@TOKEN${tokens.length - 1}@@`; });
      text = escapeHtml(text);
      text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" loading="lazy">');
      text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');
      return text.replace(/@@TOKEN(\d+)@@/g, (_, index) => tokens[Number(index)]);
    };
    const isTableDivider = line => /^\s*\|?(?:\s*:?-{3,}:?\s*\|)+\s*:?-{3,}:?\s*\|?\s*$/.test(line);
    const cells = line => line.trim().replace(/^\||\|$/g, '').split('|').map(item => item.trim());

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r/g, '').split('\n');
      const out = [];
      let paragraph = [];
      let listType = null;
      let inQuote = false;
      let quoteLines = [];
      let inCode = false;
      let codeLines = [];
      let headingIndex = 0;

      const flushParagraph = () => {
        if (paragraph.length) out.push(`<p>${inline(paragraph.join(' '))}</p>`);
        paragraph = [];
      };
      const flushList = () => { if (listType) out.push(`</${listType}>`); listType = null; };
      const flushQuote = () => { if (inQuote) out.push(`<blockquote>${quoteLines.map(line => `<p>${inline(line)}</p>`).join('')}</blockquote>`); inQuote = false; quoteLines = []; };

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (inCode) {
          if (/^```/.test(line)) { out.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`); inCode = false; codeLines = []; }
          else codeLines.push(line);
          continue;
        }
        if (/^```/.test(line)) { flushParagraph(); flushList(); flushQuote(); inCode = true; continue; }
        if (/^>\s?/.test(line)) { flushParagraph(); flushList(); inQuote = true; quoteLines.push(line.replace(/^>\s?/, '')); continue; }
        if (inQuote && !/^>/.test(line)) flushQuote();
        if (line.includes('|') && i + 1 < lines.length && isTableDivider(lines[i + 1])) {
          flushParagraph(); flushList();
          const headers = cells(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes('|') && lines[i].trim()) { rows.push(cells(lines[i])); i++; }
          i--;
          out.push(`<div class="table-wrap"><table><thead><tr>${headers.map(cell => `<th>${inline(cell)}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${inline(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
          continue;
        }
        const heading = line.match(/^(#{1,4})\s+(.+)$/);
        if (heading) {
          flushParagraph(); flushList();
          const level = heading[1].length;
          const text = heading[2].replace(/\*\*/g, '');
          if (level === 1) continue;
          const id = slugify(text, ++headingIndex);
          out.push(`<h${level} id="${id}">${inline(heading[2])}</h${level}>`);
          continue;
        }
        if (/^---+$/.test(line.trim())) { flushParagraph(); flushList(); out.push('<hr>'); continue; }
        const unordered = line.match(/^[-*]\s+(.+)$/);
        const ordered = line.match(/^\d+\.\s+(.+)$/);
        if (unordered || ordered) {
          flushParagraph();
          const wanted = ordered ? 'ol' : 'ul';
          if (listType !== wanted) { flushList(); out.push(`<${wanted}>`); listType = wanted; }
          out.push(`<li>${inline((unordered || ordered)[1])}</li>`);
          continue;
        }
        if (!line.trim()) { flushParagraph(); flushList(); continue; }
        paragraph.push(line.trim());
      }
      if (inCode) out.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
      flushParagraph(); flushList(); flushQuote();
      return out.join('\n');
    }

    async function decodeEmbeddedMarkdown() {
      const bytes = Uint8Array.from(atob(EMBEDDED_MARKDOWN_GZIP_BASE64), char => char.charCodeAt(0));
      if ('DecompressionStream' in window) {
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        return await new Response(stream).text();
      }
      throw new Error('当前浏览器不支持内置文档解压。');
    }

    function buildToc() {
      const toc = document.getElementById('toc-list');
      const headings = [...document.querySelectorAll('#content h2')];
      toc.innerHTML = headings.map(heading => `<a href="#${heading.id}">${heading.textContent}</a>`).join('');
      if ('IntersectionObserver' in window) {
        const links = [...toc.querySelectorAll('a')];
        const observer = new IntersectionObserver(entries => {
          entries.filter(entry => entry.isIntersecting).forEach(entry => {
            links.forEach(link => link.classList.toggle('active', link.getAttribute('href') === `#${entry.target.id}`));
          });
        }, { rootMargin: '-20% 0px -70% 0px' });
        headings.forEach(heading => observer.observe(heading));
      }
    }

    async function init() {
      const content = document.getElementById('content');
      try {
        const markdown = await decodeEmbeddedMarkdown();
        content.innerHTML = renderMarkdown(markdown);
        buildToc();
      } catch (error) {
        content.innerHTML = `<div class="status">文档载入失败：${escapeHtml(error.message)}</div>`;
      }
    }

    document.getElementById('copy-link').addEventListener('click', async event => {
      const button = event.currentTarget;
      const original = button.innerHTML;
      try { await navigator.clipboard.writeText(location.href); button.textContent = '已复制'; }
      catch { button.textContent = '请复制地址栏链接'; }
      setTimeout(() => { button.innerHTML = original; }, 1600);
    });
    document.getElementById('print-page').addEventListener('click', () => window.print());
    init();
  })();
  </script>
</body>
</html>
